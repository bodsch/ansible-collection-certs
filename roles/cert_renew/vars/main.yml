---

cert_renew_dependencies: []

cert_renew_defaults_checks:
  dns: true
  well_known: true
  on_unreachable: drop
  timeout: 5

cert_renew_defaults_notification:
  enabled: false
  events:
    - changed
    - failed
  sender: ""
  recipient: ""
  smtp:
    server_name: localhost
    port: 587
    tls: starttls
    auth:
      username: ""
      password: ""

cert_renew_defaults_timer:
  enabled: true
  type: systemd
  on_calendar: "*-*-* 02:58:00"
  randomized_delay: 1h
  cron:
    minute: "58"
    hour: "2"
    weekday: "*"

...
