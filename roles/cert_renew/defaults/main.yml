---

# cert_renew_state: installed

cert_renew_system_user:
  owner: root
  group: root

cert_renew_system_service:
  state: started
  enabled: true

# renewal script (needs the lego binary, e.g. from the bodsch.certs.lego role)
cert_renew_script: /usr/local/bin/lego-multi-renew.py
cert_renew_lego_binary: /usr/bin/lego

# ownership of the configuration and state directories
# (the script itself runs as root)
# cert_renew_owner: root
# cert_renew_group: root

cert_renew_config_dir: /etc/lego
cert_renew_issuers_dir: /etc/lego/issuers.d
cert_renew_domains_dir: /etc/lego/domains.d
cert_renew_state_dir: /var/lib/lego

cert_renew_days: 30
cert_renew_key_type: ec256            # rsa2048|rsa3072|rsa4096|rsa8192|ec256|ec384
cert_renew_lock_file: /run/lego-renew.lock
cert_renew_default_issuer: ""         # issuer for certificates without 'issuer'
cert_renew_log_file: /var/log/lego-renew.log
cert_renew_live_dir: ""               # e.g. /etc/letsencrypt/live (certbot layout)
cert_renew_lego_timeout: 600

# http-01 pre-checks (DNS + .well-known reachability)
cert_renew_checks: {}
#  dns: true
#  well_known: true
#  on_unreachable: drop               # drop | fail | ignore
#  timeout: 5

cert_renew_dns_resolver: []
#  - 9.9.9.9

# services to reload/restart after any changed certificate
cert_renew_restarts: []
#  - service: nginx
#    action: reload                   # reload | restart

cert_renew_notification: {}
#  enabled: true
#  events: [changed, failed]          # or [always]
#  sender: lego@example.com
#  recipient: admin@example.com
#  smtp:
#    server_name: smtp.example.com
#    port: 587
#    tls: starttls                    # starttls | ssl | none
#    auth:
#      username: ""
#      password: ""

# periodic run: systemd timer (systemd hosts) or cron
cert_renew_timer:
  state: stopped
  enabled: false
  type: systemd                      # systemd | cron
  on_calendar: "*-*-* 02:58:00"
  randomized_delay: 1h
  cron:
    minute: "58"
    hour: "2"
    weekday: "*"

cert_renew_issuers: []

cert_renew_certificates: []

...
