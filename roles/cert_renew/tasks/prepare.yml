---

- name: include OS specific configuration
  ansible.builtin.include_vars: "{{ lookup('first_found', params) }}"
  vars:
    params:
      paths:
        - "vars"
      files:
        # eg. debian-10 / ubuntu-20 / centos-8 / oraclelinux-8
        - "{{ ansible_facts.distribution | lower }}-{{ ansible_facts.distribution_major_version }}.yml"
        # eg. archlinux-systemd / archlinux-openrc
        - "{{ ansible_facts.distribution | lower }}-{{ ansible_facts.service_mgr | lower }}.yml"
        # eg. debian / ubuntu / centos / oraclelinux
        - "{{ ansible_facts.distribution | lower }}.yml"
        # eg. redhat / debian
        - "{{ ansible_facts.os_family | lower }}.yml"
        # artixlinux
        - "{{ ansible_facts.os_family | lower | replace(' ', '') }}.yml"
        # artixlinux-openrc
        - "{{ ansible_facts.distribution | lower | replace(' ', '') }}-{{ ansible_facts.service_mgr | lower }}.yml"
        - default.yml
      skip: true

- name: detect ansible check_mode
  bodsch.core.check_mode:
  register: _check_mode

- name: define running_in_check_mode
  ansible.builtin.set_fact:
    running_in_check_mode: '{{ _check_mode.check_mode }}'

- name: detect lego binary
  ansible.builtin.stat:
    path: "{{ cert_renew_lego_binary }}"
    get_checksum: false
  register: _cert_renew_lego_binary

- name: ensure the lego binary is installed
  when:
    - not running_in_check_mode
  ansible.builtin.assert:
    that:
      - _cert_renew_lego_binary.stat.exists
      - _cert_renew_lego_binary.stat.executable | default(false)
    fail_msg: >-
      lego binary {{ cert_renew_lego_binary }} is missing or not executable.
      Install it first, e.g. with the bodsch.certs.lego role.
    quiet: true

...
