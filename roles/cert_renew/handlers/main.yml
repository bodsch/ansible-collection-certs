---

- name: daemon-reload
  become: true
  ansible.builtin.systemd:
    daemon_reload: true
    force: true
  when:
    - ansible_facts.service_mgr | lower == "systemd"

- name: restart lego-renew.timer
  become: true
  ansible.builtin.systemd:
    name: lego-renew.timer
    state: restarted
  when:
    - ansible_facts.service_mgr | lower == "systemd"
    - cert_renew_timer.type == "systemd"
    - cert_renew_timer.enabled | bool
    - not running_in_check_mode

...
