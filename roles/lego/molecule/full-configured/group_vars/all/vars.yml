---

lego_issuers:

  # 1. step-ca im Lab (interne CA, DNS-Challenge via PowerDNS)
  - name: step-ca-lab
    server: "https://ca.lab.local:9000/acme/acme/directory"
    email: "lego@lab.local"
    ca_certificate: "/etc/ssl/lab-root.crt"     # für Trust gegen die interne CA
    challenge:
      type: dns
      provider: pdns
      env:
        PDNS_API_URL: "https://dns.lab.local:8081"
        PDNS_API_KEY: "{{ vault_pdns_api_key }}"

  # 2. Let's Encrypt prod (öffentlich)
  - name: letsencrypt-prod
    server: "https://acme-v02.api.letsencrypt.org/directory"
    email: "ops@example.com"
    challenge:
      type: http
      webroot: "/var/www/acme-challenge"

  # 3. Let's Encrypt staging (zum Testen)
  - name: letsencrypt-staging
    server: "https://acme-staging-v02.api.letsencrypt.org/directory"
    email: "ops@example.com"
    challenge:
      type: dns
      provider: pdns
      env:
        PDNS_API_URL: "https://dns.lab.local:8081"
        PDNS_API_KEY: "{{ vault_pdns_api_key }}"

  # 4. ZeroSSL — Beispiel mit EAB (jetzt noch nicht relevant, aber Schema steht)
  - name: zerossl
    server: "https://acme.zerossl.com/v2/DV90"
    email: "ops@example.com"
    eab:
      kid: "kid-string"
      hmac_key: "{{ vault_zerossl_hmac }}"
    challenge:
      type: http
      webroot: "/var/www/acme-challenge"

lego_tls_certificates:
  - domain: lab.local
    subdomains:
      - www.lab.local
      - api.lab.local
    issuer: step-ca-lab
    install:
      cert: /etc/ssl/lab/fullchain.pem
      key:  /etc/ssl/lab/privkey.pem
      ca:   /etc/ssl/lab/chain.pem
      owner: nginx
      group: nginx
    post_hook: systemctl reload nginx
  #
  - domain: mail.lab.local
    issuer: step-ca-lab
    install:
      cert: /etc/postfix/tls/fullchain.pem
      key:  /etc/postfix/tls/privkey.pem
      cert_mode: "0644"
      key_mode:  "0640"
    pre_hook:
      - "test -d /etc/postfix/tls || mkdir -p /etc/postfix/tls"
    post_hook:
      - "systemctl reload postfix"
      - "systemctl reload dovecot"

...
