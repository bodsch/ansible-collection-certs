---
# Render one YAML file per certificate entry to /etc/cert-manager/domains.d/<domain>.yml.
# The renewal script reads these and invokes `lego` with the right
# issuer/sans/install paths.
#
# Files are world-unreadable (mode 0640) because install paths can hint at the
# host's TLS topology; the lego service user reads them, optional readers in
# the `lego` group are tolerated.

- name: validate certificate definitions
  ansible.builtin.assert:
    that:
      - _cert_manager_cert_errors | length == 0
    fail_msg: |-
      Invalid cert_manager_certificates:
      {{ _cert_manager_cert_errors | join('\n  - ') }}
    success_msg: "cert_manager_certificates validated"
  vars:
    _cert_manager_cert_errors: >-
      {{ cert_manager_certificates
         | bodsch.certs.validate_lego_certificates(
             known_issuers=cert_manager_issuers,
             default_issuer=cert_manager_default_issuer | default(''),
             var_name='cert_manager_certificates') }}

- name: render domain files
  ansible.builtin.template:
    src: etc/cert-manager/domain.yml.j2
    dest: "{{ cert_manager_domains_dir }}/{{ item.domain | replace('*', '_') }}.yml"
    owner: "{{ cert_manager_system_user.owner }}"
    group: "{{ cert_manager_system_user.group }}"
    mode: "0640"
  loop: "{{ cert_manager_certificates }}"
  loop_control:
    label: "{{ item.domain }}"
  vars:
    domain: "{{ item }}"

- name: prune stale domain files
  bodsch.certs.lego_prune:
    path: "{{ cert_manager_domains_dir }}"
    pattern: "*.yml"
    suffix: ".yml"
    keep: "{{ cert_manager_certificates | map(attribute='domain') | map('replace', '*', '_') | list }}"

...
