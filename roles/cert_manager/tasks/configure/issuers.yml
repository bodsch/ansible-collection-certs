---
# Configure issuers — write one EnvironmentFile per issuer to
# /etc/cert-manager/issuers.d/<name>.env. The renewal script later picks
# the right file based on the domain spec's `issuer` reference.

- name: validate issuer definitions
  ansible.builtin.assert:
    that:
      - _cert_manager_issuer_errors | length == 0
    fail_msg: |-
      Invalid cert_manager_issuers:
      {{ _cert_manager_issuer_errors | join('\n  - ') }}
    success_msg: "cert_manager_issuers validated"
  vars:
    _cert_manager_issuer_errors: "{{ cert_manager_issuers | bodsch.certs.validate_lego_issuers(var_name='cert_manager_issuers') }}"

- name: render issuer files
  ansible.builtin.template:
    src: etc/cert-manager/issuer.yml.j2
    dest: "{{ cert_manager_issuers_dir }}/{{ item.name }}.yml"
    owner: "{{ cert_manager_system_user.owner }}"
    group: "{{ cert_manager_system_user.group }}"
    mode: "0600"
  loop: "{{ cert_manager_issuers }}"
  loop_control:
    label: "{{ item.name }}"
  vars:
    issuer: "{{ item }}"

- name: prune stale issuer files
  bodsch.certs.lego_prune:
    path: "{{ cert_manager_issuers_dir }}"
    pattern: "*.yml"
    suffix: ".yml"
    keep: "{{ cert_manager_issuers | map(attribute='name') | list }}"

...
