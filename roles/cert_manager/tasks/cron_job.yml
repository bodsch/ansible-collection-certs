---

- name: merge cert_manager timer configuration between defaults and custom
  ansible.builtin.set_fact:
    cert_manager_timer: "{{ cert_manager_defaults_timer | combine(cert_manager_timer, recursive=True) }}"

- name: remove cert-manager cron job
  when:
    - not cert_manager_timer.enabled | default('false') | bool
    - cert_manager_timer.type | default('cron') | string | lower in ["cron", "systemd"]
  block:
    - name: remove cron jobs
      when:
        - not cert_manager_timer.type | default('cron') | string == "cron"
      block:
        - name: remove cert-manager cron job
          ansible.builtin.cron:
            name: run cert-manager to renew TLS certificates over Lego
            job: /usr/bin/cert-manager.py
            user: root
            cron_file: cert-manager
            state: absent
          failed_when: false

        - name: disable systemd timer
          ansible.builtin.service:
            name: cert-manager.timer
            enabled: false
            state: stopped
          failed_when: false

- name: create cert-manager cron job
  when:
    # - cert_manager_timer.enabled | default('false') | bool
    - cert_manager_timer.type | default('cron') |  string | lower in ["cron", "systemd"]
  block:
    - name: remove cron file
      when:
        - not cert_manager_timer.type | default('cron') | string == "cron"
      block:
        - name: remove cert-manager cron job
          ansible.builtin.cron:
            name: run cert-manager to renew TLS certificates over Lego
            job: /usr/bin/cert-manager.py
            user: root
            cron_file: cert-manager
            state: absent
          failed_when: false

    - name: remove system unit file
      when:
        - not cert_manager_timer.type | default('cron') | string == "systemd"
      block:
        - name: disable cert-manager background timer
          ansible.builtin.service:
            name: cert-manager.timer
            enabled: false
            state: stopped
          failed_when: false

    - name: cron daemon
      when:
        - cert_manager_timer.enabled | default('false') | bool
        - cert_manager_timer.daemon | default('') | string | length > 0
        - cert_manager_timer.type | default('cron') | string == "cron"
      block:
        - name: ensure cron daemon is installed
          ansible.builtin.package:
            name: "{{ cert_manager_timer.daemon }}"
            state: present

        - name: create cron job for background jobs
          ansible.builtin.cron:
            name: Exports calendars and addressbooks from ownCloud/Nextcloud
            job: /usr/bin/cert-manager.py
            minute: "{{ cert_manager_timer.minute | default('58') }}"
            hour: "{{ cert_manager_timer.hour | default('2') }}"
            weekday: "{{ cert_manager_timer.weekday | default('*') }}"
            user: root
            cron_file: cert-manager-timer
            state: present

    - name: systemd unit
      when:
        # - cert_manager_timer.enabled | default('false') | bool
        - cert_manager_timer.type | default('cron') | string == "systemd"
      block:
        - name: create systemd unit file
          ansible.builtin.template:
            src: etc/init/systemd/cert-manager.service.j2
            dest: "{{ systemd_lib_directory }}/cert-manager.service"
            mode: "0644"
          notify:
            - daemon reload

        - name: create systemd timer file
          bodsch.systemd.systemd_timer:
            name: cert-manager
            unit:
              Description: Run cert-manager on specific weekdays
            timer:
              persistent: true
              randomized_delay_sec: "43200"
            schedule:
              weekday: "{{ cert_manager_timer.weekday | default(['Sat']) }}"
              hour: "{{ cert_manager_timer.hour | default('2') }}"
              minute: "{{ cert_manager_timer.minute | default('58') }}"
            install:
              wanted_by: timers.target
            path: "{{ systemd_lib_directory }}"
          notify:
            - daemon reload

        - name: flush handlers
          ansible.builtin.meta: flush_handlers

        # - name: ensure cert-manager.service enabled
        #   ansible.builtin.service:
        #     name: cert-manager.service
        #     enabled: "{{ cert_manager_timer.enabled | default(false) | bool }}"

        - name: enable cert-manager background timer
          ansible.builtin.service:
            name: cert-manager.timer
            enabled: "{{ cert_manager_timer.enabled | default(false) | bool }}"
            state: "{{ cert_manager_timer.state | default('stopped') }}"

...
